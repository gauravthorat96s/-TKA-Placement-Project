<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Recruitment &amp; Placement Management System</title>
<link rel="stylesheet" href="css/style.css"></head>
<body><div class="login-wrap"><div class="login-card">
  <div class="brand-logo"><img src="images/logo.png" alt="Kiran Academy logo"></div>
  <h1>Recruitment &amp; Placement Management System</h1>
  <div class="sub">Authorized users only</div>
  <form onsubmit="return false">
    <div class="field"><label class="req">Username / Email</label><input type="text" value="recruiter@demo.com"></div>
    <div style="height:10px"></div>
    <div class="field"><label class="req">Password</label><input type="password" value="password123"></div>
    <div style="height:10px"></div>
    <div class="field"><label class="req">Role</label><select><option value="">Select</option><option>Admin</option><option selected>Recruiter</option><option>Placement Officer</option></select></div>
    <div class="btn-row">
      <button type="reset" class="btn btn-secondary">Reset</button>
      <a class="btn" href="dashboard.html">Login</a>
    </div>
  </form>
  <p class="login-note"><a href="#">Forgot Password?</a> (prototype only)</p>
</div></div>
<div class="footer" style="background:transparent;border:0;color:#cfd9ea">Kiran Academy | Recruitment &amp; Placement Management System | UI Prototype</div>
</body></html>
